# Native SGLang profile for /generate and the associated query endpoints.
engine: sglang
model: mock-sglang-native
served-model-name:
  - Qwen/Qwen3-32B-SGLang
mode: random
seed: 20260918
max-model-len: 131072
max-num-seqs: 600
max-waiting-queue-length: 2000
latency-calculator: per-token
prefill-overhead: 70ms
prefill-time-per-token: 35us
prefill-time-std-dev: 8ms
inter-token-latency: 16ms
inter-token-latency-std-dev: 2ms
time-factor-under-load: 2.0
traffic-simulation:
  profile: sglang-native-normal-chat
  scenario: default
  enable-test-controls: false
