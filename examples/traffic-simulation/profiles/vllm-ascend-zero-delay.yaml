# OpenAI-compatible vLLM-Ascend profile for measuring simulator overhead.
model: mock-vllm-ascend
served-model-name:
  - Qwen/Qwen3-32B-Ascend
mode: random
seed: 20260918
max-model-len: 131072
max-num-seqs: 400
max-waiting-queue-length: 2000
latency-calculator: per-token
prefill-overhead: 0s
prefill-time-per-token: 0s
prefill-time-std-dev: 0s
inter-token-latency: 0s
inter-token-latency-std-dev: 0s
time-factor-under-load: 1.0
traffic-simulation:
  profile: vllm-ascend-zero-delay
  scenario: default
  enable-test-controls: false
